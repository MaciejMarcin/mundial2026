];

function isKnockout(match) {
  const ko = ['1/32 finału','1/16 finału','1/8 finału','Ćwierćfinał','Półfinał','Mecz o 3. miejsce','Finał'];
  return ko.includes(match.stage);
}

function calcPoints(pred, match) {
  if (match.home_score === null || match.away_score === null) return null;
  const ph = pred.home_score, pa = pred.away_score;
  const mh = match.home_score, ma = match.away_score;
  let pts = 0;
  if (ph === mh && pa === ma) {
    pts += (mh === ma) ? POINTS.draw_exact : POINTS.exact;
  } else if (ph === pa && mh === ma) {
    pts += POINTS.draw_correct;
  } else {
    const predW = ph > pa ? 'H' : ph < pa ? 'A' : 'D';
    const matchW = mh > ma ? 'H' : mh < ma ? 'A' : 'D';
    if (predW === matchW && matchW !== 'D') pts += POINTS.winner;
  }
  // Bonus za kto przechodzi dalej (tylko mecze pucharowe)
  if (isKnockout(match) && match.qualifier && pred.qualifier) {
    if (pred.qualifier === match.qualifier) pts += POINTS.qualifier;
  }
  return pts;
}

function ptsLabel(pts) { return pts > 0 ? '+' + pts + ' pkt' : '0 pkt'; }

function ptsCls(pts) {
  if (pts === POINTS.draw_exact || pts === POINTS.exact) return 'pts-exact';
  if (pts === POINTS.draw_correct) return 'pts-draw';
  if (pts === POINTS.winner) return 'pts-winner';
  return 'pts-miss';
}

function matchStatus(match) {
  const now = new Date();
  const mt = new Date(match.match_date);
  const openAt = new Date(mt.getTime() - OPEN_BEFORE_H * 3600000);
  const lockAt = new Date(mt.getTime() - LOCK_BEFORE_MIN * 60000);
  if (match.home_score !== null) return 'done';
  if (now >= lockAt) return 'locked';
  if (now >= openAt) return 'open';
  return 'soon';
}

function formatDate(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('pl-PL', {day:'numeric',month:'short',weekday:'short'}) + ' ' + dt.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
}

function formatCountdown(ms) {
  if (ms <= 0) return '';
  const totalS = Math.floor(ms / 1000);
  const d = Math.floor(totalS / 86400);
  const h = Math.floor((totalS % 86400) / 3600);
  const m = Math.floor((totalS % 3600) / 60);
  const s = totalS % 60;
  if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

async function doLogin() {
  const name = document.getElementById('login-name').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  if (!name || !pass) { err.textContent = 'Wpisz nick i hasło!'; return; }
  try {
    const { data: player, error } = await db.from('players').select('*').eq('name', name).maybeSingle();
    if (error) { err.textContent = 'Błąd połączenia.'; return; }
    if (!player) { err.textContent = 'Nie znaleziono użytkownika.'; return; }
    if (player.password !== pass) { err.textContent = 'Złe hasło!'; return; }
    currentPlayer = player;
    isAdmin = player.is_admin === true;
    err.textContent = '';
    startApp();
  } catch(e) { err.textContent = 'Błąd połączenia.'; console.error(e); }
}

function logout() {
  currentPlayer = null;
  isAdmin = false;
  if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  document.getElementById('gate-screen').style.display = '';
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-name').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-error').textContent = '';
}

function startApp() {
  document.getElementById('gate-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = '';
  document.getElementById('user-badge').textContent = currentPlayer.name + (isAdmin ? ' 🔑' : '');
  document.getElementById('tab-admin').style.display = isAdmin ? '' : 'none';
  loadData();
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(updateCountdowns, 1000);
}

async function loadData() {
  try {
    const [r1, r2, r3, r4] = await Promise.all([
      db.from('matches').select('*').order('match_date'),
      db.from('predictions').select('*'),
      db.from('players').select('*'),
      db.from('special_predictions').select('*'),
    ]);
    allMatches = r1.data || [];
    allPredictions = r2.data || [];
    allPlayers = r3.data || [];
    allSpecials = r4.data || [];
    if (!allMatches.length) await seedMatches();
    renderCurrentTab();
  } catch(e) { showToast('Błąd ładowania'); console.error(e); }
}

async function seedMatches() {
  await db.from('matches').insert(MATCHES_DATA);
  const { data } = await db.from('matches').select('*').order('match_date');
  allMatches = data || [];
}

function renderCurrentTab() {
  const active = document.querySelector('.tab.active');
  if (!active) return;
  const name = active.id.replace('tab-','');
  if (name === 'matches') renderMatches();
  else if (name === 'leaderboard') renderLeaderboard();
  else if (name === 'specials') renderSpecials();
  else if (name === 'admin') renderAdmin();
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  ['matches','leaderboard','specials','admin'].forEach(function(v) {
    document.getElementById('view-' + v).style.display = v === name ? '' : 'none';
  });
  renderCurrentTab();
}

function updateCountdowns() {
  const now = new Date();
  document.querySelectorAll('[data-opens]').forEach(function(el) {
    const diff = new Date(el.dataset.opens) - now;
    el.textContent = diff > 0 ? '⏳ TYPOWANIE OTWIERA SIĘ ZA: ' + formatCountdown(diff) : '';
  });
  document.querySelectorAll('[data-closes]').forEach(function(el) {
    const diff = new Date(el.dataset.closes) - now;
    el.textContent = diff > 0 ? '🔔 TYPOWANIE ZAMYKA SIĘ ZA: ' + formatCountdown(diff) : '';
  });
}

function renderMatches() {
  const el = document.getElementById('view-matches');
  const upcoming = allMatches.filter(function(m) { return m.home_score === null; });
  const done = allMatches.filter(function(m) { return m.home_score !== null; });
  let html = '';
  let lastGroup = null;

  if (upcoming.length) {
    html += '<div class="section-title">Nadchodzące mecze</div>';
    for (const m of upcoming) {
      if (m.group_name && m.group_name !== lastGroup) {
        html += '<div class="group-label">' + (m.stage === 'Faza grupowa' ? 'Grupa ' : '') + m.group_name + '</div>';
        lastGroup = m.group_name;
      }
      html += renderMatchCard(m);
    }
  }
  if (done.length) {
    html += '<div class="section-title" style="margin-top:1.5rem;">Zakończone</div>';
    for (const m of done) html += renderMatchCard(m);
  }
  if (!html) html = '<div class="empty">Brak meczów</div>';
  el.innerHTML = html;
}

function renderMatchCard(m) {
  const myPred = allPredictions.find(function(p) { return p.match_id === m.id && p.player_id === currentPlayer.id; });
  const status = matchStatus(m);
  const hasResult = status === 'done';
  const mt = new Date(m.match_date);
  const openAt = new Date(mt.getTime() - OPEN_BEFORE_H * 3600000);
  const lockAt = new Date(mt.getTime() - LOCK_BEFORE_MIN * 60000);

  const scoreArea = hasResult
    ? '<div class="score-display">' + m.home_score + ':' + m.away_score + '</div>'
    : '<div class="score-display" style="color:#ccc;font-size:18px;">vs</div>';

  let timingHtml = '';
  if (status === 'soon') {
    timingHtml = '<div class="timing-info timing-opens" data-opens="' + openAt.toISOString() + '">⏳ TYPOWANIE OTWIERA SIĘ ZA: ...</div>';
  } else if (status === 'open') {
    timingHtml = '<div class="timing-info timing-closes" data-closes="' + lockAt.toISOString() + '">🔔 TYPOWANIE ZAMYKA SIĘ ZA: ...</div>';
  } else if (status === 'locked') {
    timingHtml = '<div class="timing-info timing-locked">🔒 TYPOWANIE ZAMKNIĘTE</div>';
  }

  let predArea = '';
  if (myPred) {
    const pts = hasResult ? calcPoints(myPred, m) : null;
    predArea = '<div class="my-prediction">'
      + '<span class="pred-label">Twój typ: <strong>' + myPred.home_score + ':' + myPred.away_score + '</strong></span>'
      + '<div style="display:flex;align-items:center;gap:6px;">'
      + (pts !== null ? '<span class="pred-points ' + ptsCls(pts) + '">' + ptsLabel(pts) + '</span>' : '')
      + '</div></div>';
  } else if (status === 'open') {
    predArea = '<div style="margin-top:12px;">'
      + '<div class="score-inputs">'
      + '<input type="number" class="score-input" id="ph_' + m.id + '" min="0" max="20" placeholder="0" />'
      + '<span class="score-sep">:</span>'
      + '<input type="number" class="score-input" id="pa_' + m.id + '" min="0" max="20" placeholder="0" />'
      + '</div>'
      + '<button class="btn btn-primary" style="margin-top:10px;" onclick="savePred(\'' + m.id + '\')">Postaw typ</button>'
      + '</div>';
  }

  const allPreds = allPredictions.filter(function(p) { return p.match_id === m.id; });
  let predsArea = '';
  if (allPreds.length) {
    predsArea = '<div class="all-preds"><div class="all-preds-title">Typy graczy (' + allPreds.length + ')</div>';
    for (const p of allPreds) {
      const player = allPlayers.find(function(pl) { return pl.id === p.player_id; });
      const pts = hasResult ? calcPoints(p, m) : null;
      const isMe = p.player_id === currentPlayer.id;
      predsArea += '<div class="pred-row">'
        + '<span class="pred-name">' + (player ? player.name : '?')
        + (isMe ? '<span class="me-badge">Ty</span>' : '')
        + (isAdmin ? ' <button class="btn btn-secondary btn-small" style="padding:2px 7px;font-size:11px;" onclick="deletePredAdmin(\'' + p.id + '\')">Usuń</button>' : '')
        + '</span>'
        + '<span style="display:flex;align-items:center;gap:6px;">' + p.home_score + ':' + p.away_score
        + (pts !== null ? ' <span class="pred-points ' + ptsCls(pts) + '">' + ptsLabel(pts) + '</span>' : '')
        + '</span></div>';
    }
    predsArea += '</div>';
  }

  const stageLbl = m.group_name ? (m.stage === 'Faza grupowa' ? 'Gr. ' : '') + m.group_name : m.stage;
  const stageCls = hasResult ? 'done' : '';

  return '<div class="card">'
    + '<div class="match-header">'
    + '<span class="match-date">' + formatDate(m.match_date) + '</span>'
    + '<span class="match-stage ' + stageCls + '">' + stageLbl + '</span>'
    + '</div>'
    + '<div class="teams">'
    + '<div class="team"><span class="team-name">' + m.home_team + '</span></div>'
    + scoreArea
    + '<div class="team"><span class="team-name">' + m.away_team + '</span></div>'
    + '</div>'
    + timingHtml
    + predArea
    + predsArea
    + '</div>';
}

function selectQualifier(matchId, side) {
  const homeBtn = document.getElementById('qual_' + matchId + '_home');
  const awayBtn = document.getElementById('qual_' + matchId + '_away');
  const valInput = document.getElementById('qual_val_' + matchId);
  if (!homeBtn || !awayBtn || !valInput) return;
  const match = allMatches.find(function(m) { return m.id === matchId; });
  if (!match) return;
  if (side === 'home') {
    homeBtn.style.background = '#1a472a';
    homeBtn.style.color = '#fff';
    homeBtn.style.borderColor = '#1a472a';
    awayBtn.style.background = '#f9f9f9';
    awayBtn.style.color = '#111';
    awayBtn.style.borderColor = '#ddd';
    valInput.value = match.home_team;
  } else {
    awayBtn.style.background = '#1a472a';
    awayBtn.style.color = '#fff';
    awayBtn.style.borderColor = '#1a472a';
    homeBtn.style.background = '#f9f9f9';
    homeBtn.style.color = '#111';
    homeBtn.style.borderColor = '#ddd';
    valInput.value = match.away_team;
  }
}

async function savePred(matchId) {
  const h = parseInt(document.getElementById('ph_' + matchId) ? document.getElementById('ph_' + matchId).value : '');
  const a = parseInt(document.getElementById('pa_' + matchId) ? document.getElementById('pa_' + matchId).value : '');
  if (isNaN(h) || isNaN(a)) return showToast('Wpisz wynik!');
  const match = allMatches.find(function(m) { return m.id === matchId; });
  if (matchStatus(match) !== 'open') return showToast('Typowanie nieaktywne!');
  const match = allMatches.find(function(m) { return m.id === matchId; });
  const qualInput = document.getElementById('qual_val_' + matchId);
  const qualifier = (isKnockout(match) && qualInput) ? (qualInput.value || null) : null;
  if (isKnockout(match) && !qualifier) return showToast('Wybierz kto przejdzie dalej!');
  const { error } = await db.from('predictions').insert({ player_id: currentPlayer.id, match_id: matchId, home_score: h, away_score: a, qualifier: qualifier });
  if (error) return showToast('Błąd: ' + error.message);
  showToast('Typ zapisany! ✅');
  await loadData();
}

async function deletePredAdmin(predId) {
  if (!isAdmin) return;
  await db.from('predictions').delete().eq('id', predId);
  showToast('Typ usunięty');
  await loadData();
}

function renderLeaderboard() {
  const el = document.getElementById('view-leaderboard');
  const scores = allPlayers.map(function(player) {
    let total = 0, exact = 0, winner = 0, draw = 0, miss = 0, typed = 0;
    allPredictions.filter(function(p) { return p.player_id === player.id; }).forEach(function(pred) {
      const match = allMatches.find(function(m) { return m.id === pred.match_id; });
      if (!match || match.home_score === null) return;
      typed++;
      const pts = calcPoints(pred, match);
      total += pts;
      if (pts === POINTS.exact) exact++;
      else if (pts === POINTS.draw_exact) draw++;
      else if (pts === POINTS.winner) winner++;
      else miss++;
    });
    let specialPts = 0;
    allSpecials.filter(function(s) { return s.player_id === player.id && s.points; }).forEach(function(s) {
      specialPts += s.points;
      total += s.points;
    });
    return { player, total, exact, winner, draw, miss, typed, specialPts };
  }).sort(function(a, b) { return b.total - a.total; });

  const medals = ['🥇','🥈','🥉'];
  const bgColors = ['#fffbeb','#f8fafc','#fff8f0'];

  let html = '<div class="section-title">Tabela wyników</div>';

  if (!scores.length) {
    html += '<div class="empty">Brak graczy</div>';
  } else {
    scores.forEach(function(s, i) {
      const isMe = s.player.id === currentPlayer.id;
      const bg = i < 3 ? bgColors[i] : '#fff';
      const border = isMe ? 'border: 2px solid #1a472a;' : '';
      html += '<div style="background:' + bg + ';border-radius:12px;padding:12px 16px;margin-bottom:8px;' + border + '">'
        // Górna linia: miejsce + imię + punkty
        + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">'
        + '<div style="font-size:22px;width:32px;text-align:center;">' + (medals[i] || ('<span style="font-size:15px;font-weight:700;color:#888;">' + (i+1) + '</span>')) + '</div>'
        + '<div style="flex:1;font-size:16px;font-weight:700;">' + s.player.name + (isMe ? '<span class="me-badge">Ty</span>' : '') + '</div>'
        + '<div style="font-size:20px;font-weight:800;color:#1a472a;">' + s.total + ' pkt</div>'
        + '</div>'
        // Dolna linia: statystyki w pastylkach
        + '<div style="display:flex;gap:6px;flex-wrap:wrap;">'
        + '<span style="background:#e8f5e9;color:#2e7d32;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;">✅ ' + s.exact + '× dokładny</span>'
        + '<span style="background:#fff3e0;color:#e65100;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;">🟡 ' + s.draw + '× remis</span>'
        + '<span style="background:#e3f2fd;color:#1565c0;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;">🔵 ' + s.winner + '× wynik</span>'
        + '<span style="background:#f5f5f5;color:#888;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;">❌ ' + s.miss + '× chybiony</span>'
        + (s.specialPts ? '<span style="background:#f3e5f5;color:#7b1fa2;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;">🌟 +' + s.specialPts + ' specjalne</span>' : '')
        + '</div>'
        + '</div>';
    });
  }

  html += '<div style="margin-top:1rem;padding:0.75rem 1rem;background:#f9f9f9;border-radius:10px;font-size:12px;color:#666;line-height:1.9;">'
    + '<strong>System punktów:</strong><br>'
    + '✅ Dokładny wynik: <strong>+' + POINTS.exact + ' pkt</strong> &nbsp;|&nbsp; '
    + '🟡 Dokładny remis: <strong>+' + POINTS.draw_exact + ' pkt</strong><br>'
    + '🔵 Trafiony zwycięzca: <strong>+' + POINTS.winner + ' pkt</strong> &nbsp;|&nbsp; '
    + '🟠 Trafiony remis: <strong>+' + POINTS.draw_correct + ' pkt</strong>'
    + '</div>';

  el.innerHTML = html;
}

    html += '<div class="special-card"><div class="special-title">' + cat.label + '</div>';

    if (myPick) {
      html += '<div class="special-my">Twój typ: ' + myPick.value

        + '</div>';

  if (existing) return showToast('Już obstawiłeś tę kategorię!');
  const { error } = await db.from('special_predictions').insert({ player_id: currentPlayer.id, category: categoryId, value: value, points: null });
  if (error) return showToast('Błąd: ' + error.message);
  showToast('Typ zapisany! ✅');
  await loadData();
}

      + '</div>'
      + '<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;cursor:pointer;"><input type="checkbox" id="new-is-admin" /> Admin</label>'
      + '<button class="btn btn-primary" style="margin-top:10px;" onclick="addPlayer()">Dodaj gracza</button></div>';
    if (allPlayers.length) {
      html += '<div class="card">';
      for (const p of allPlayers) {
        html += '<div class="user-row">'
          + '<span class="user-name">' + p.name + (p.is_admin ? ' 🔑' : '') + '</span>'
          + '<span class="user-pass">' + (p.password || '—') + '</span>'
          + '<button class="btn btn-danger btn-small" onclick="deletePlayer(\'' + p.id + '\',\'' + p.name + '\')">Usuń</button>'
          + '</div>';
      }
      html += '</div>';
    } else {
      html += '<div class="empty">Brak graczy</div>';
    }
  }

  if (adminTab === 'matches') {
    html += '<div class="add-form"><h3>➕ Dodaj mecz</h3>'
      + '<div class="inline-fields">'
      + '<div class="field"><label>Gospodarz</label><input type="text" id="nm-home" placeholder="Np. Brazylia" /></div>'
      + '<div class="field"><label>Gość</label><input type="text" id="nm-away" placeholder="Np. Niemcy" /></div>'
      + '</div>'
      + '<div class="inline-fields" style="margin-top:8px;">'
      + '<div class="field"><label>Data i czas (lokalny)</label><input type="datetime-local" id="nm-date" /></div>'
      + '<div class="field"><label>Etap</label><select id="nm-stage">'
      + '<option value="Faza grupowa">Faza grupowa</option>'
      + '<option value="1/8 finału">1/8 finału</option>'
      + '<option value="Ćwierćfinał">Ćwierćfinał</option>'
      + '<option value="Półfinał">Półfinał</option>'
      + '<option value="Mecz o 3. miejsce">Mecz o 3. miejsce</option>'
      + '<option value="Finał">Finał</option>'
      + '</select></div></div>'
      + '<div class="field" style="margin-top:8px;"><label>Grupa (opcjonalnie)</label><input type="text" id="nm-group" placeholder="Np. A" maxlength="5" /></div>'
      + '<button class="btn btn-primary" style="margin-top:10px;" onclick="addMatch()">Dodaj mecz</button></div>';

    const upcoming = allMatches.filter(function(m) { return m.home_score === null; });
    if (upcoming.length) {
      html += '<div class="card">';
      for (const m of upcoming) {
        html += '<div class="admin-match" style="display:flex;align-items:center;gap:8px;">'
          + '<div style="flex:1;">'
          + '<div class="admin-match-name">' + m.home_team + ' vs ' + m.away_team + '</div>'
          + '<div style="font-size:11px;color:#888;">' + formatDate(m.match_date) + (m.group_name ? ' · Gr. ' + m.group_name : '') + ' · ' + m.stage + '</div>'
          + '</div>'
          + '<button class="btn btn-danger btn-small" onclick="deleteMatch(\'' + m.id + '\',\'' + m.home_team + ' vs ' + m.away_team + '\')">Usuń</button>'
          + '</div>';
      }
      html += '</div>';
    } else {
      html += '<div class="empty">Brak nadchodzących meczów</div>';
    }
  }

  if (adminTab === 'results') {
    const pending = allMatches.filter(function(m) { return m.home_score === null && matchStatus(m) === 'locked'; });
    if (!pending.length) {
      html += '<div class="empty">Brak meczów do wpisania.<br><small>Mecze pojawiają się tu 10 min przed startem.</small></div>';
    } else {
      html += '<div class="card">';
      for (const m of pending) {
        html += '<div class="admin-match">'
          + '<div class="admin-match-name">' + m.home_team + ' vs ' + m.away_team + ' · ' + formatDate(m.match_date) + '</div>'
          + '<div class="admin-score-row">'
          + '<input type="number" id="ar_h_' + m.id + '" min="0" max="20" placeholder="0" />'
          + '<span style="font-size:18px;font-weight:700;">:</span>'
          + '<input type="number" id="ar_a_' + m.id + '" min="0" max="20" placeholder="0" />'
          + '<button class="btn btn-primary btn-small" onclick="saveResult(\'' + m.id + '\')">Zatwierdź ✓</button>'
          + '</div></div>';
      }
      html += '</div>';
    }
    const withResult = allMatches.filter(function(m) { return m.home_score !== null; });
    if (withResult.length) {
      html += '<div class="section-title" style="margin-top:1.5rem;">Zakończone</div><div class="card">';
      for (const m of withResult) {
        html += '<div class="admin-match" style="display:flex;align-items:center;justify-content:space-between;">'
          + '<div class="admin-match-name">' + m.home_team + ' ' + m.home_score + ':' + m.away_score + ' ' + m.away_team + '</div>'
          + '<button class="btn btn-secondary btn-small" onclick="clearResult(\'' + m.id + '\')">Cofnij</button>'
          + '</div>';
      }
      html += '</div>';
    }
  }
  el.innerHTML = html;

  // Event delegation dla przycisków usuń mecz
  el.querySelectorAll('[data-match-id]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const id = btn.getAttribute('data-match-id');
      const name = btn.closest('.admin-match').querySelector('.admin-match-name').textContent;
      deleteMatch(id, name);
    });
  });
}

async function addPlayer() {
  const name = document.getElementById('new-name').value.trim();
  const pass = document.getElementById('new-pass').value.trim();
  const isAdminPlayer = document.getElementById('new-is-admin').checked;
  if (!name || !pass) return showToast('Wpisz nick i hasło!');
  const { error } = await db.from('players').insert({ name: name, password: pass, is_admin: isAdminPlayer });
  if (error) return showToast(error.message.includes('unique') ? 'Ten nick już istnieje!' : 'Błąd: ' + error.message);
  document.getElementById('new-name').value = '';
  document.getElementById('new-pass').value = '';
  document.getElementById('new-is-admin').checked = false;
  showToast('Dodano: ' + name + ' ✅');
  await loadData();
}

async function deletePlayer(id, name) {
  if (!confirm('Usunąć gracza "' + name + '"?')) return;
  await db.from('predictions').delete().eq('player_id', id);
  await db.from('players').delete().eq('id', id);
  showToast('Usunięto: ' + name);
  await loadData();
}

async function addMatch() {
  const home = document.getElementById('nm-home').value.trim();
  const away = document.getElementById('nm-away').value.trim();
  const dateVal = document.getElementById('nm-date').value;
  const stage = document.getElementById('nm-stage').value;
  const group = document.getElementById('nm-group').value.trim().toUpperCase() || null;
  if (!home || !away || !dateVal) return showToast('Wypełnij wszystkie pola!');
  const match_date = new Date(dateVal).toISOString();
  const { error } = await db.from('matches').insert({ home_team: home, away_team: away, match_date: match_date, stage: stage, group_name: group });
  if (error) return showToast('Błąd: ' + error.message);
  document.getElementById('nm-home').value = '';
  document.getElementById('nm-away').value = '';
  document.getElementById('nm-date').value = '';
  document.getElementById('nm-group').value = '';
  showToast('Dodano: ' + home + ' vs ' + away + ' ✅');
  await loadData();
}

async function deleteMatch(id, name) {
  if (!confirm('Usunąć mecz "' + name + '"?\nZostaną też usunięte wszystkie typy do tego meczu.')) return;
  await db.from('predictions').delete().eq('match_id', id);
  await db.from('matches').delete().eq('id', id);
  showToast('Mecz usunięty');
  await loadData();
}

function selectAdminQualifier(matchId, side) {
  const homeBtn = document.getElementById('ar_qual_' + matchId + '_home');
  const awayBtn = document.getElementById('ar_qual_' + matchId + '_away');
  const valInput = document.getElementById('ar_qual_val_' + matchId);
  if (!homeBtn || !awayBtn || !valInput) return;
  const match = allMatches.find(function(m) { return m.id === matchId; });
  if (!match) return;
  if (side === 'home') {
    homeBtn.style.background = '#1a472a'; homeBtn.style.color = '#fff'; homeBtn.style.borderColor = '#1a472a';
    awayBtn.style.background = '#f9f9f9'; awayBtn.style.color = '#111'; awayBtn.style.borderColor = '#ddd';
    valInput.value = match.home_team;
  } else {
    awayBtn.style.background = '#1a472a'; awayBtn.style.color = '#fff'; awayBtn.style.borderColor = '#1a472a';
    homeBtn.style.background = '#f9f9f9'; homeBtn.style.color = '#111'; homeBtn.style.borderColor = '#ddd';
    valInput.value = match.away_team;
  }
}

async function saveResult(matchId) {
  const hEl = document.getElementById('ar_h_' + matchId);
  const aEl = document.getElementById('ar_a_' + matchId);
  const h = parseInt(hEl ? hEl.value : '');
  const a = parseInt(aEl ? aEl.value : '');
  if (isNaN(h) || isNaN(a)) return showToast('Wpisz wynik!');
  const match = allMatches.find(function(m) { return m.id === matchId; });
  const qualInput = document.getElementById('ar_qual_val_' + matchId);
  const qualifier = (isKnockout(match) && qualInput) ? (qualInput.value || null) : null;
  if (isKnockout(match) && !qualifier) return showToast('Wybierz kto przechodzi dalej!');
  await db.from('matches').update({ home_score: h, away_score: a, qualifier: qualifier }).eq('id', matchId);
  showToast('Wynik zapisany ✅');
  await loadData();
}

async function clearResult(matchId) {
  await db.from('matches').update({ home_score: null, away_score: null }).eq('id', matchId);
  showToast('Wynik cofnięty');
  await loadData();
}
</script>
</body>
</html>
