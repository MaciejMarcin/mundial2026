function calcPoints(pred, match) {
  if (match.home_score === null || match.away_score === null) return null;
  const ph = pred.home_score, pa = pred.away_score;
  const mh = match.home_score, ma = match.away_score;
  if (ph === mh && pa === ma) return (mh === ma) ? POINTS.draw_exact : POINTS.exact;
  if (ph === pa && mh === ma) return POINTS.draw_correct;
  const predW = ph > pa ? 'H' : ph < pa ? 'A' : 'D';
  const matchW = mh > ma ? 'H' : mh < ma ? 'A' : 'D';
  if (predW === matchW && matchW !== 'D') return POINTS.winner;
  return 0;
}

function ptsLabel(pts) { return pts > 0 ? `+${pts} pkt` : '0 pkt'; }
function ptsCls(pts) {
  if (pts === POINTS.draw_exact || pts === POINTS.exact) return 'pts-exact';
  if (pts === POINTS.draw_correct) return 'pts-draw';
  if (pts === POINTS.winner) return 'pts-winner';
  return 'pts-miss';
}

function matchStatus(match) {
  const now = new Date();
  const mt = new Date(match.match_date);
  const openAt = new Date(mt.getTime() - OPEN_BEFORE_H * 3600 * 1000);
  const lockAt = new Date(mt.getTime() - LOCK_BEFORE_MIN * 60 * 1000);
  if (match.home_score !== null) return 'done';
  if (now >= lockAt) return 'locked';
  if (now >= openAt) return 'open';
  return 'soon';
}

function formatDate(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('pl-PL', {day:'numeric',month:'short',weekday:'short'}) + ' ' + dt.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
}

function formatCountdown(ms) {
  if (ms <= 0) return '00:00:00';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  if (h >= 24) {
    const d = Math.floor(h / 24);
    const rh = h % 24;
    return `${d}d ${rh}h ${m}m`;
  }
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

async function doLogin() {
  const name = document.getElementById('login-name').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  if (!name || !pass) { err.textContent = 'Wpisz nick i hasło!'; return; }
  try {
    const { data: player, error } = await db.from('players').select('*').eq('name', name).maybeSingle();
    if (error) { err.textContent = 'Błąd połączenia.'; return; }
    if (!player) { err.textContent = 'Nie znaleziono użytkownika.'; return; }
    if (player.password !== pass) { err.textContent = 'Złe hasło!'; return; }
    currentPlayer = player;
    isAdmin = player.is_admin === true;
    err.textContent = '';
    startApp();
  } catch(e) { err.textContent = 'Błąd połączenia.'; }
}

    allMatches = matches || [];
    allPredictions = preds || [];
    allPlayers = players || [];
    if (!allMatches.length) await seedMatches();
    renderCurrentTab();
  } catch(e) { showToast('Błąd ładowania'); }
}

async function seedMatches() {
  await db.from('matches').insert(MATCHES_DATA);
  const { data } = await db.from('matches').select('*').order('match_date');
  allMatches = data || [];
}

function renderCurrentTab() {
  const active = document.querySelector('.tab.active')?.id?.replace('tab-','');
  if (active === 'matches') renderMatches();
  else if (active === 'leaderboard') renderLeaderboard();
  else if (active === 'admin') renderAdmin();
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  ['matches','leaderboard','admin'].forEach(v => {
    document.getElementById('view-' + v).style.display = v === name ? '' : 'none';
  });
  renderCurrentTab();
}

function updateCountdowns() {
  const now = new Date();
  document.querySelectorAll('[data-countdown]').forEach(el => {
    const target = new Date(el.dataset.countdown);
    const diff = target - now;
    el.textContent = diff > 0 ? `Typowanie otwiera się za: ${formatCountdown(diff)}` : '';
  });
}

function renderMatches() {
  const el = document.getElementById('view-matches');
  const upcoming = allMatches.filter(m => m.home_score === null);
  const done = allMatches.filter(m => m.home_score !== null);
  let html = '';
  let lastGroup = null;

  if (upcoming.length) {
    html += `<div class="section-title">Nadchodzące mecze</div>`;
    for (const m of upcoming) {
      if (m.group_name && m.group_name !== lastGroup) {
        html += `<div class="group-label">${m.stage === 'Faza grupowa' ? 'Grupa ' : ''}${m.group_name}</div>`;
        lastGroup = m.group_name;
      }
      html += renderMatchCard(m);
    }
  }
  if (done.length) {
    html += `<div class="section-title" style="margin-top:1.5rem;">Zakończone</div>`;
    for (const m of done) html += renderMatchCard(m);
  }
  if (!html) html = `<div class="empty">Brak meczów</div>`;
  el.innerHTML = html;
}

function renderMatchCard(m) {
  const myPred = allPredictions.find(p => p.match_id === m.id && p.player_id === currentPlayer.id);
  const status = matchStatus(m);
  const hasResult = status === 'done';
  const mt = new Date(m.match_date);
  const openAt = new Date(mt.getTime() - OPEN_BEFORE_H * 3600 * 1000);

  const scoreArea = hasResult
    ? `<div class="score-display">${m.home_score}:${m.away_score}</div>`
    : `<div class="score-display" style="color:#ccc;font-size:18px;">vs</div>`;

  let predArea = '';
  if (myPred) {
    const pts = hasResult ? calcPoints(myPred, m) : null;
    predArea = `<div class="my-prediction">
      <span class="pred-label">Twój typ: <strong>${myPred.home_score}:${myPred.away_score}</strong></span>
      <div style="display:flex;align-items:center;gap:6px;">
        ${pts !== null ? `<span class="pred-points ${ptsCls(pts)}">${ptsLabel(pts)}</span>` : ''}
        ${status === 'open' ? `<button class="btn btn-secondary btn-small" onclick="deletePred('${m.id}')">Usuń</button>` : ''}
        ${isAdmin && status === 'locked' ? `<button class="btn btn-secondary btn-small" onclick="deletePredAdmin('${myPred.id}')">Usuń ✦</button>` : ''}
      </div>
    </div>`;
  } else if (status === 'open') {
    predArea = `<div style="margin-top:12px;">
      <div class="score-inputs">
        <input type="number" class="score-input" id="ph_${m.id}" min="0" max="20" placeholder="0" />
        <span class="score-sep">:</span>
        <input type="number" class="score-input" id="pa_${m.id}" min="0" max="20" placeholder="0" />
      </div>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="savePred('${m.id}')">Postaw typ</button>
    </div>`;
  } else if (status === 'soon') {
    predArea = `<div class="countdown" data-countdown="${openAt.toISOString()}">Ładowanie...</div>`;
  }

  // Typy wszystkich graczy — widoczne zawsze
  const allPreds = allPredictions.filter(p => p.match_id === m.id);
  let predsArea = '';
  if (allPreds.length) {
    predsArea = `<div class="all-preds"><div class="all-preds-title">Typy graczy</div>`;
    for (const p of allPreds) {
      const player = allPlayers.find(pl => pl.id === p.player_id);
      const pts = hasResult ? calcPoints(p, m) : null;
      const isMe = p.player_id === currentPlayer.id;
      predsArea += `<div class="pred-row">
        <span class="pred-name">${player?.name || '?'}${isMe ? '<span class="me-badge">Ty</span>' : ''}${isAdmin ? ` <button class="btn btn-secondary btn-small" style="padding:2px 7px;font-size:11px;" onclick="deletePredAdmin('${p.id}')">Usuń</button>` : ''}</span>
        <span style="display:flex;align-items:center;gap:6px;">${p.home_score}:${p.away_score}${pts !== null ? ` <span class="pred-points ${ptsCls(pts)}">${ptsLabel(pts)}</span>` : ''}</span>
      </div>`;
    }
    predsArea += `</div>`;
  }

  const lockedBadge = status === 'locked' ? `<span class="locked-badge">🔒 Zamknięte</span>` : '';
  const soonBadge = status === 'soon' ? `<span class="soon-badge">⏳ Wkrótce</span>` : '';

  return `<div class="card">
    <div class="match-header">
      <span class="match-date">${formatDate(m.match_date)}</span>
      ${lockedBadge}${soonBadge}
      <span class="match-stage${hasResult?' done':''}">${m.group_name ? (m.stage==='Faza grupowa'?'Gr. ':'')+m.group_name : m.stage}</span>
    </div>
    <div class="teams">
      <div class="team"><span class="team-name">${m.home_team}</span></div>
      ${scoreArea}
      <div class="team"><span class="team-name">${m.away_team}</span></div>
    </div>
    ${predArea}
    ${predsArea}
  </div>`;
}

async function savePred(matchId) {
  const h = parseInt(document.getElementById('ph_' + matchId)?.value);
  const a = parseInt(document.getElementById('pa_' + matchId)?.value);
  if (isNaN(h) || isNaN(a)) return showToast('Wpisz wynik!');
  const match = allMatches.find(m => m.id === matchId);
  if (matchStatus(match) !== 'open') return showToast('Typowanie nieaktywne!');
  const { error } = await db.from('predictions').insert({ player_id: currentPlayer.id, match_id: matchId, home_score: h, away_score: a });
  if (error) return showToast('Błąd: ' + error.message);
  showToast('Typ zapisany! ✅');
  await loadData();
}

async function deletePred(matchId) {
  const pred = allPredictions.find(p => p.match_id === matchId && p.player_id === currentPlayer.id);
  if (!pred) return;
  const match = allMatches.find(m => m.id === matchId);
  if (matchStatus(match) !== 'open') return showToast('Za późno!');
  await db.from('predictions').delete().eq('id', pred.id);
  showToast('Typ usunięty');
  await loadData();
}

async function deletePredAdmin(predId) {
  if (!isAdmin) return;
  await db.from('predictions').delete().eq('id', predId);
  showToast('Typ usunięty (admin)');
  await loadData();
}

function renderLeaderboard() {
  const el = document.getElementById('view-leaderboard');
  const scores = allPlayers.map(player => {
    let total = 0, exact = 0, winner = 0, draw = 0;
    for (const pred of allPredictions.filter(p => p.player_id === player.id)) {
      const match = allMatches.find(m => m.id === pred.match_id);
      if (!match || match.home_score === null) continue;
      const pts = calcPoints(pred, match);
      total += pts;
      if (pts === POINTS.exact) exact++;
      else if (pts === POINTS.draw_exact) draw++;
      else if (pts === POINTS.winner) winner++;
    }
    return { player, total, exact, winner, draw };
  }).sort((a, b) => b.total - a.total);

  const medals = ['🥇','🥈','🥉'];
  let html = `<div class="section-title">Tabela wyników</div><div class="card">`;
  if (!scores.length) html += `<div class="empty">Brak graczy</div>`;
  scores.forEach((s, i) => {
    const isMe = s.player.id === currentPlayer?.id;
    html += `<div class="lb-row">
      <div class="lb-rank">${medals[i] || (i+1)}</div>
      <div class="lb-name">${s.player.name}${isMe ? '<span class="me-badge">Ty</span>' : ''}</div>
      <div style="text-align:right;">
        <span class="lb-pts">${s.total} pkt</span>
        <div class="lb-breakdown">${s.exact}× dokł. · ${s.draw}× remis · ${s.winner}× wynik</div>
      </div>
    </div>`;
  });
  html += `</div><div style="margin-top:1rem;padding:0.75rem 1rem;background:#f9f9f9;border-radius:10px;font-size:12px;color:#666;line-height:1.9;">
    <strong>System punktów:</strong><br>
    ✅ Dokładny wynik: <strong>+${POINTS.exact} pkt</strong><br>
    🟡 Dokładny remis: <strong>+${POINTS.draw_exact} pkt</strong><br>
    🔵 Dobry zwycięzca: <strong>+${POINTS.winner} pkt</strong><br>
    🟠 Dobry remis: <strong>+${POINTS.draw_correct} pkt</strong>
  </div>`;
  el.innerHTML = html;
}

let adminTab = 'players';
function showAdminTab(t) {
  adminTab = t;
  renderAdmin();
}

function renderAdmin() {
  if (!isAdmin) return;
  const el = document.getElementById('view-admin');
  let html = `<div class="tab-btns">
    <button class="tab-btn${adminTab==='players'?' active':''}" onclick="showAdminTab('players')">Gracze</button>
    <button class="tab-btn${adminTab==='matches'?' active':''}" onclick="showAdminTab('matches')">Mecze</button>
    <button class="tab-btn${adminTab==='results'?' active':''}" onclick="showAdminTab('results')">Wyniki</button>
  </div>`;

  if (adminTab === 'players') {
    html += `<div class="add-user-form">
      <h3>➕ Dodaj gracza</h3>
      <div class="inline-fields">
        <div class="field"><label>Nick</label><input type="text" id="new-name" placeholder="Np. ArturW" maxlength="20" /></div>
        <div class="field"><label>Hasło</label><input type="text" id="new-pass" placeholder="Hasło..." maxlength="30" /></div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;cursor:pointer;">
        <input type="checkbox" id="new-is-admin" /> Admin
      </label>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="addPlayer()">Dodaj gracza</button>
    </div>`;
    if (allPlayers.length) {
      html += `<div class="card">`;
      for (const p of allPlayers) {
        html += `<div class="user-row">
          <span class="user-name">${p.name}${p.is_admin ? ' 🔑' : ''}</span>
          <span class="user-pass">${p.password || '—'}</span>
          <button class="btn btn-danger btn-small" onclick="deletePlayer('${p.id}','${p.name}')">Usuń</button>
        </div>`;
      }
      html += `</div>`;
    } else {
      html += `<div class="empty">Brak graczy</div>`;
    }
  }

  if (adminTab === 'matches') {
    html += `<div class="add-match-form">
      <h3>➕ Dodaj mecz</h3>
      <div class="inline-fields">
        <div class="field"><label>Gospodarz</label><input type="text" id="nm-home" placeholder="Np. Brazylia" /></div>
        <div class="field"><label>Gość</label><input type="text" id="nm-away" placeholder="Np. Niemcy" /></div>
      </div>
      <div class="inline-fields" style="margin-top:8px;">
        <div class="field"><label>Data i czas</label><input type="datetime-local" id="nm-date" /></div>
        <div class="field"><label>Etap</label>
          <select id="nm-stage">
            <option value="Faza grupowa">Faza grupowa</option>
            <option value="1/8 finału">1/8 finału</option>
            <option value="Ćwierćfinał">Ćwierćfinał</option>
            <option value="Półfinał">Półfinał</option>
            <option value="Mecz o 3. miejsce">Mecz o 3. miejsce</option>
            <option value="Finał">Finał</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-top:8px;"><label>Grupa (opcjonalnie)</label><input type="text" id="nm-group" placeholder="Np. A" maxlength="5" /></div>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="addMatch()">Dodaj mecz</button>
    </div>`;

    const upcoming = allMatches.filter(m => m.home_score === null);
    if (upcoming.length) {
      html += `<div class="card">`;
      for (const m of upcoming) {
        html += `<div class="admin-match">
          <div class="admin-match-name">${m.home_team} vs ${m.away_team}</div>
          <div style="font-size:11px;color:#888;">${formatDate(m.match_date)} · ${m.group_name ? 'Gr. '+m.group_name+' · ' : ''}${m.stage}</div>
        </div>`;
      }
      html += `</div>`;
    }
  }

  if (adminTab === 'results') {
    const pending = allMatches.filter(m => m.home_score === null && matchStatus(m) === 'locked');
    if (!pending.length) {
      html += `<div class="empty">Brak meczów do wpisania.<br><small>Mecze pojawią się tu 10 min przed startem.</small></div>`;
    } else {
      html += `<div class="card">`;
      for (const m of pending) {
        html += `<div class="admin-match">
          <div class="admin-match-name">${m.home_team} vs ${m.away_team} · ${formatDate(m.match_date)}</div>
          <div class="admin-score-row">
            <input type="number" id="ar_h_${m.id}" min="0" max="20" placeholder="0" />
            <span style="font-size:18px;font-weight:700;">:</span>
            <input type="number" id="ar_a_${m.id}" min="0" max="20" placeholder="0" />
            <button class="btn btn-primary btn-small" onclick="saveResult('${m.id}')">Zatwierdź ✓</button>
          </div>
        </div>`;
      }
      html += `</div>`;
    }
    const withResult = allMatches.filter(m => m.home_score !== null);
    if (withResult.length) {
      html += `<div class="section-title" style="margin-top:1.5rem;">Zakończone</div><div class="card">`;
      for (const m of withResult) {
        html += `<div class="admin-match">
          <div class="admin-match-name">${m.home_team} ${m.home_score}:${m.away_score} ${m.away_team}</div>
          <button class="btn btn-secondary btn-small" onclick="clearResult('${m.id}')">Cofnij wynik</button>
        </div>`;
      }
      html += `</div>`;
    }
  }

  el.innerHTML = html;
}

async function addPlayer() {
  const name = document.getElementById('new-name').value.trim();
  const pass = document.getElementById('new-pass').value.trim();
  const isAdminPlayer = document.getElementById('new-is-admin').checked;
  if (!name || !pass) return showToast('Wpisz nick i hasło!');
  const { error } = await db.from('players').insert({ name, password: pass, is_admin: isAdminPlayer });
  if (error) return showToast(error.message.includes('unique') ? 'Ten nick już istnieje!' : 'Błąd: ' + error.message);
  document.getElementById('new-name').value = '';
  document.getElementById('new-pass').value = '';
  document.getElementById('new-is-admin').checked = false;
  showToast(`Dodano: ${name} ✅`);
  await loadData();
}

async function deletePlayer(id, name) {
  if (!confirm(`Usunąć gracza "${name}"?`)) return;
  await db.from('predictions').delete().eq('player_id', id);
  await db.from('players').delete().eq('id', id);
  showToast(`Usunięto: ${name}`);
  await loadData();
}

async function addMatch() {
  const home = document.getElementById('nm-home').value.trim();
  const away = document.getElementById('nm-away').value.trim();
  const dateVal = document.getElementById('nm-date').value;
  const stage = document.getElementById('nm-stage').value;
  const group = document.getElementById('nm-group').value.trim().toUpperCase() || null;
  if (!home || !away || !dateVal) return showToast('Wypełnij wszystkie pola!');
  const match_date = new Date(dateVal).toISOString();
  const { error } = await db.from('matches').insert({ home_team: home, away_team: away, match_date, stage, group_name: group });
  if (error) return showToast('Błąd: ' + error.message);
  document.getElementById('nm-home').value = '';
  document.getElementById('nm-away').value = '';
  document.getElementById('nm-date').value = '';
  document.getElementById('nm-group').value = '';
  showToast(`Dodano mecz: ${home} vs ${away} ✅`);
  await loadData();
}

async function saveResult(matchId) {
  const h = parseInt(document.getElementById('ar_h_' + matchId)?.value);
  const a = parseInt(document.getElementById('ar_a_' + matchId)?.value);
  if (isNaN(h) || isNaN(a)) return showToast('Wpisz wynik!');
  await db.from('matches').update({ home_score: h, away_score: a }).eq('id', matchId);
  showToast('Wynik zapisany ✅');
  await loadData();
}

async function clearResult(matchId) {
  await db.from('matches').update({ home_score: null, away_score: null }).eq('id', matchId);
  showToast('Wynik cofnięty');
  await loadData();
}
</script>
</body>
</html>
