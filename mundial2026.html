function isKnockout(match) {
  return ['1/16 finału','1/8 finału','Ćwierćfinał','Półfinał','Mecz o 3. miejsce','Finał'].includes(match.stage);
}

function calcPoints(pred, match) {
  if (match.home_score === null || match.away_score === null) return null;
  const ph = pred.home_score, pa = pred.away_score;
  const mh = match.home_score, ma = match.away_score;
  let pts = 0;
  if (ph === mh && pa === ma) {
    pts = (mh === ma) ? POINTS.draw_exact : POINTS.exact;
  } else if (ph === pa && mh === ma) {
    pts = POINTS.draw_correct;
  } else {
    const predW = ph > pa ? 'H' : ph < pa ? 'A' : 'D';
    const matchW = mh > ma ? 'H' : mh < ma ? 'A' : 'D';
    if (predW === matchW && matchW !== 'D') pts = POINTS.winner;
  }
  if (isKnockout(match) && match.qualifier && pred.qualifier && pred.qualifier === match.qualifier) pts += POINTS.qualifier;
  return pts;
}

function ptsLabel(pts) { return pts > 0 ? '+' + pts + ' pkt' : '0 pkt'; }
function ptsCls(pts) {
  if (pts === null || pts === undefined) return 'pts-miss';
  if (pts <= 0) return 'pts-miss';
  if (pts >= 5) return 'pts-perfect'; // max: dokładny remis + kto przejdzie
  if (pts >= 4) return 'pts-exact';   // dokładny remis
  if (pts === 3) return 'pts-exact';  // dokładny wynik
  if (pts === 2) return 'pts-draw';   // trafiony remis
  if (pts >= 1) return 'pts-winner';  // trafiony zwycięzca
  return 'pts-miss';
}

function matchStatus(match) {
  const now = new Date();
  const mt = new Date(match.match_date);
  const openAt = new Date(mt.getTime() - OPEN_BEFORE_H * 3600000);
  const lockAt = new Date(mt.getTime() - LOCK_BEFORE_MIN * 60000);
  if (match.home_score !== null) return 'done';
  if (now >= lockAt) return 'locked';
  if (now >= openAt) return 'open';
  return 'soon';
}

function formatDate(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('pl-PL', {day:'numeric',month:'short',weekday:'short'}) + ' ' + dt.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
}

function formatCountdown(ms) {
  if (ms <= 0) return '';
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function showToast(msg) {

}

async function doLogin() {
  const name = document.getElementById('login-name').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  if (!name || !pass) { err.textContent = 'Wpisz nick i hasło!'; return; }
  try {
    const { data: player, error } = await db.from('players').select('*').eq('name', name).maybeSingle();
    if (error) { err.textContent = 'Błąd połączenia.'; return; }
    if (!player) { err.textContent = 'Nie znaleziono użytkownika.'; return; }
    if (player.password !== pass) { err.textContent = 'Złe hasło!'; return; }
    currentPlayer = player;
    isAdmin = player.is_admin === true;
    err.textContent = '';
    startApp();
  } catch(e) { err.textContent = 'Błąd połączenia.'; }
}

function logout() {
  currentPlayer = null; isAdmin = false;
  if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  document.getElementById('gate-screen').style.display = '';
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-name').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-error').textContent = '';
}

function startApp() {
  document.getElementById('gate-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = '';
  document.getElementById('user-badge').textContent = currentPlayer.name + (isAdmin ? ' 🔑' : '');
  document.getElementById('tab-admin').style.display = isAdmin ? '' : 'none';
  loadData();
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(updateCountdowns, 1000);
}

async function loadData() {
  try {
    const [r1,r2,r3,r4] = await Promise.all([
      db.from('matches').select('*').order('match_date'),
      db.from('predictions').select('*').limit(5000),
      db.from('players').select('*'),
      db.from('special_predictions').select('*'),
    ]);
    allMatches = r1.data || [];
    allPredictions = r2.data || [];
    allPlayers = r3.data || [];
    allSpecials = r4.data || [];
    if (!allMatches.length) await seedMatches();
    renderCurrentTab();
  } catch(e) { showToast('Błąd ładowania'); console.error(e); }
}

async function seedMatches() {
  await db.from('matches').insert(MATCHES_DATA);
  const { data } = await db.from('matches').select('*').order('match_date');
  allMatches = data || [];
}

function renderCurrentTab() {
  const active = document.querySelector('.tab.active');
  if (!active) return;
  const name = active.id.replace('tab-','');
  if (name === 'matches') renderMatches();
  else if (name === 'leaderboard') renderLeaderboard();
  else if (name === 'specials') renderSpecials();
  else if (name === 'admin') renderAdmin();
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  ['matches','leaderboard','specials','admin'].forEach(function(v) {
    const el = document.getElementById('view-' + v);
    if (v === name) {
      el.style.display = '';
      el.classList.remove('view-anim');
      void el.offsetWidth;
      el.classList.add('view-anim');
    } else {
      el.style.display = 'none';
    }
  });
  renderCurrentTab();
}

function updateCountdowns() {
  const now = new Date();
  document.querySelectorAll('[data-opens]').forEach(function(el) {
    const diff = new Date(el.dataset.opens) - now;
    el.textContent = diff > 0 ? '⏳ OTWIERA SIĘ ZA: ' + formatCountdown(diff) : '';
  });
  document.querySelectorAll('[data-closes]').forEach(function(el) {
    const diff = new Date(el.dataset.closes) - now;
    el.textContent = diff > 0 ? '🔔 ZAMYKA SIĘ ZA: ' + formatCountdown(diff) : '';
  });
}

function renderMatches() {
  const el = document.getElementById('view-matches');
  const groups = [...new Set(allMatches.filter(function(m){return m.group_name;}).map(function(m){return m.group_name;}))].sort();

  // Kontrolki (wyszukiwarka + dropdown) renderujemy tylko raz
  if (!document.getElementById('match-search-input')) {
    let ctrlHtml = '<div class="search-box"><span class="search-icon">🔍</span>'
      + '<input type="text" id="match-search-input" placeholder="Szukaj drużyny..." oninput="setSearch(this.value)" /></div>';
    ctrlHtml += '<select class="filter-select" id="match-filter-select" onchange="setFilter(this.value)">'
      + '<option value="all">Wszystkie mecze</option>'
      + '<option value="open">Do obstawienia</option>'
      + '<option value="done">Zakończone</option>';
    groups.forEach(function(g) { ctrlHtml += '<option value="' + g + '">Grupa ' + g + '</option>'; });
    ctrlHtml += '</select>';
    ctrlHtml += '<div id="match-list"></div>';
    el.innerHTML = ctrlHtml;
  }

  // Zaktualizuj wartość selecta bez rerenderowania
  const sel = document.getElementById('match-filter-select');
  if (sel) sel.value = matchFilter;

  renderMatchList();
}

function renderMatchList() {
  const listEl = document.getElementById('match-list');
  if (!listEl) { renderMatches(); return; }
  const groups = [...new Set(allMatches.filter(function(m){return m.group_name;}).map(function(m){return m.group_name;}))].sort();

  let filtered = allMatches.filter(function(m) {
    if (matchSearch && !m.home_team.toLowerCase().includes(matchSearch) && !m.away_team.toLowerCase().includes(matchSearch)) return false;
    if (matchFilter === 'open') return m.home_score === null && matchStatus(m) === 'open';
    if (matchFilter === 'done') return m.home_score !== null;
    if (groups.includes(matchFilter)) return m.group_name === matchFilter;
    return true;
  });



  let html = '';
  if (!filtered.length) { listEl.innerHTML = '<div class="empty">Brak meczów</div>'; return; }

  const upcoming = filtered.filter(function(m) { return m.home_score === null; });
  const done = filtered.filter(function(m) { return m.home_score !== null; }).sort(function(a,b) { return new Date(b.match_date) - new Date(a.match_date); });
  let lastGroup = null;

  if (upcoming.length) {
    html += '<div class="section-title">Nadchodzące mecze</div>';
    for (const m of upcoming) {
      if (!matchSearch && matchFilter === 'all' && m.group_name && m.group_name !== lastGroup) {
        html += '<div class="group-label">' + (m.stage === 'Faza grupowa' ? 'Grupa ' : '') + m.group_name + '</div>';
        lastGroup = m.group_name;
      }
      html += renderMatchCard(m);
    }
  }
  if (done.length) {
    html += '<div class="section-title" style="margin-top:1.25rem;">Zakończone</div>';
    for (const m of done) html += renderMatchCard(m);
  }
  listEl.innerHTML = html;
}

function renderMatchCard(m) {
  const myPred = allPredictions.find(function(p) { return p.match_id === m.id && p.player_id === currentPlayer.id; });
  const status = matchStatus(m);
  const hasResult = status === 'done';
  const mt = new Date(m.match_date);
  const openAt = new Date(mt.getTime() - OPEN_BEFORE_H * 3600000);
  const lockAt = new Date(mt.getTime() - LOCK_BEFORE_MIN * 60000);
  const knockout = isKnockout(m);

  const scoreArea = hasResult
    ? '<div class="score-box"><span class="score-num">' + m.home_score + '</span><span class="score-sep-big">:</span><span class="score-num">' + m.away_score + '</span></div>'
    : '<div class="score-vs">vs</div>';

  let timingHtml = '';
  if (status === 'soon') timingHtml = '<div class="status-bar soon"><div class="status-dot"></div><span data-opens="' + openAt.toISOString() + '">⏳ OTWIERA SIĘ ZA: ...</span></div>';
  else if (status === 'open') timingHtml = '<div class="status-bar closes"><div class="status-dot"></div><span data-closes="' + lockAt.toISOString() + '">🔔 ZAMYKA SIĘ ZA: ...</span></div>';
  else if (status === 'locked') timingHtml = '<div class="status-bar locked"><div class="status-dot"></div>🔒 TYPOWANIE ZAMKNIĘTE</div>';

  let predArea = '';
  if (myPred) {
    const pts = hasResult ? calcPoints(myPred, m) : null;
    predArea = '<div class="my-prediction">'
      + '<span class="pred-label">Twój typ: <strong>' + myPred.home_score + ':' + myPred.away_score + '</strong>'
      + (knockout && myPred.qualifier ? ' · dalej: <strong>' + myPred.qualifier + '</strong>' : '') + '</span>'
      + (pts !== null ? '<span class="pred-points ' + ptsCls(pts) + '">' + ptsLabel(pts) + '</span>' : '')
      + '</div>';
  } else if (status === 'open') {
    const qualField = knockout
      ? '<div style="margin-top:10px;"><div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.3px;">Kto przejdzie dalej?</div>'
        + '<div style="display:flex;gap:6px;">'
        + '<button type="button" id="qual_' + m.id + '_home" onclick="selectQualifier(\'' + m.id + '\',\'home\')" style="flex:1;padding:8px;border-radius:8px;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:#fff;">' + m.home_team + '</button>'
        + '<button type="button" id="qual_' + m.id + '_away" onclick="selectQualifier(\'' + m.id + '\',\'away\')" style="flex:1;padding:8px;border-radius:8px;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:#fff;">' + m.away_team + '</button>'
        + '</div><input type="hidden" id="qual_val_' + m.id + '" value="" /></div>'
      : '';
    predArea = '<div style="margin-top:12px;">'
      + '<div class="score-inputs">'
      + '<input type="number" class="score-input" id="ph_' + m.id + '" min="0" max="20" placeholder="0" />'
      + '<span class="score-sep">:</span>'
      + '<input type="number" class="score-input" id="pa_' + m.id + '" min="0" max="20" placeholder="0" />'
      + '</div>' + qualField
      + '<button class="btn btn-primary" style="margin-top:10px;" onclick="savePred(\'' + m.id + '\')">Postaw typ</button>'
      + '</div>';
  }

  const allPreds = allPredictions.filter(function(p) { return p.match_id === m.id; });
  let predsArea = '';
  if (allPreds.length) {
    predsArea = '<div class="all-preds"><div class="all-preds-title">Typy graczy (' + allPreds.length + ')</div>';
    for (const p of allPreds) {
      const player = allPlayers.find(function(pl) { return pl.id === p.player_id; });
      const pts = hasResult ? calcPoints(p, m) : null;
      const isMe = p.player_id === currentPlayer.id;
      predsArea += '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;">'
        + '<span class="pred-name">' + (player ? player.name : '?')
        + (isMe ? '<span class="me-badge">Ty</span>' : '')
        + (isAdmin ? ' <button class="btn btn-secondary btn-small" onclick="deletePredAdmin(\'' + p.id + '\')">Usuń</button>' : '')
        + '</span>'
        + '<span style="display:flex;align-items:center;gap:5px;font-size:13px;">' + p.home_score + ':' + p.away_score
        + (pts !== null ? ' <span class="pred-points ' + ptsCls(pts) + '">' + ptsLabel(pts) + '</span>' : '')
        + '</span></div>'
        + (isKnockout(m) && p.qualifier ? '<div style="font-size:11px;color:#c084fc;margin-top:2px;">dalej: <strong>' + p.qualifier + '</strong></div>' : '')
        + '</div>';
    }
    predsArea += '</div>';
  }


  const stageLbl = m.group_name ? (m.stage === 'Faza grupowa' ? 'Gr. ' : '') + m.group_name : m.stage;
  return '<div class="card">'
    + '<div class="match-header"><span class="match-date">' + formatDate(m.match_date) + '</span>'
    + '<span class="match-stage' + (hasResult?' done':'') + '">' + stageLbl + '</span></div>'
    + '<div class="teams"><div class="team"><span class="team-name">' + m.home_team + '</span></div>'
    + scoreArea
    + '<div class="team"><span class="team-name">' + m.away_team + '</span></div></div>'
    + timingHtml + predArea + predsArea + '</div>';
}

  if (!hBtn || !aBtn || !val) return;

    hBtn.style.background = '#4ade80'; hBtn.style.color = '#0f1923'; hBtn.style.borderColor = '#4ade80';
    aBtn.style.background = 'rgba(255,255,255,0.07)'; aBtn.style.color = '#fff'; aBtn.style.borderColor = 'rgba(255,255,255,0.15)';

    hBtn.style.background = 'rgba(255,255,255,0.07)'; hBtn.style.color = '#fff'; hBtn.style.borderColor = 'rgba(255,255,255,0.15)';
    val.value = match.away_team;
  }
}

async function savePred(matchId) {
  const h = parseInt(document.getElementById('ph_' + matchId) ? document.getElementById('ph_' + matchId).value : '');
  const a = parseInt(document.getElementById('pa_' + matchId) ? document.getElementById('pa_' + matchId).value : '');
  if (isNaN(h) || isNaN(a)) return showToast('Wpisz wynik!');
  const foundMatch = allMatches.find(function(m) { return m.id === matchId; });
  if (matchStatus(foundMatch) !== 'open') return showToast('Typowanie nieaktywne!');
  const qualInput = document.getElementById('qual_val_' + matchId);
  const qualifier = (isKnockout(foundMatch) && qualInput) ? (qualInput.value || null) : null;
  if (isKnockout(foundMatch) && !qualifier) return showToast('Wybierz kto przejdzie dalej!');
  const existing = allPredictions.find(function(p) { return p.match_id === matchId && p.player_id === currentPlayer.id; });
  if (existing) return showToast('Już obstawiłeś ten mecz!');
  const { error } = await db.from('predictions').insert({ player_id: currentPlayer.id, match_id: matchId, home_score: h, away_score: a, qualifier: qualifier });
  if (error) return showToast(error.message.includes('duplicate') ? 'Już obstawiłeś ten mecz!' : 'Błąd: ' + error.message);
  showToast('Typ zapisany! ✅');
  await loadData();
}

async function deletePredAdmin(predId) {
  if (!isAdmin) return;
  await db.from('predictions').delete().eq('id', predId);
  showToast('Typ usunięty');
  await loadData();
}



function renderLeaderboard() {
  const el = document.getElementById('view-leaderboard');
  const scores = allPlayers.map(function(player) {
    let total = 0, exact = 0, winner = 0, draw = 0, drawCorrect = 0, miss = 0;
    allPredictions.filter(function(p) { return p.player_id === player.id; }).forEach(function(pred) {
      const match = allMatches.find(function(m) { return m.id === pred.match_id; });
      if (!match || match.home_score === null) return;
      const pts = calcPoints(pred, match);
      total += pts;
      if (pts === POINTS.exact) exact++;
      else if (pts === POINTS.draw_exact) draw++;
      else if (pts === POINTS.draw_correct) drawCorrect++;
      else if (pts === POINTS.winner) winner++;
      else miss++;
    });
    let specialPts = 0;
    allSpecials.filter(function(s) { return s.player_id === player.id && s.points; }).forEach(function(s) { specialPts += s.points; total += s.points; });
    return { player, total, exact, winner, draw, drawCorrect, miss, specialPts };
  }).sort(function(a,b) { return b.total - a.total; });

  const medals = ['🥇','🥈','🥉'];
  const rowBg = ['linear-gradient(135deg,rgba(74,222,128,0.15),rgba(74,222,128,0.08))','linear-gradient(135deg,rgba(148,163,184,0.12),rgba(148,163,184,0.06))','linear-gradient(135deg,rgba(251,146,60,0.12),rgba(251,146,60,0.06))'];

  let html = '<div class="section-title">Tabela wyników</div>';

  // Nagłówek
  html += '<div style="display:flex;align-items:center;padding:4px 12px 6px;font-size:10px;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.5px;">'
    + '<div style="width:36px;"></div>'
    + '<div style="flex:1;min-width:0;max-width:130px;">Gracz</div>'
    + '<div style="width:54px;text-align:right;margin-right:8px;">Pkt</div>'
    + '<div style="margin-left:auto;display:flex;">'
    + '<div style="width:26px;text-align:center;">✅</div>'
    + '<div style="width:26px;text-align:center;">🟡</div>'
    + '<div style="width:26px;text-align:center;">🔵</div>'
    + '<div style="width:26px;text-align:center;">🟠</div>'
    + '<div style="width:26px;text-align:center;">❌</div>'
    + '</div></div>';

  if (!scores.length) { html += '<div class="empty">Brak graczy</div>'; }
  else {
    scores.forEach(function(s, i) {
      const isMe = s.player.id === currentPlayer.id;
      const bg = i < 3 ? rowBg[i] : 'rgba(255,255,255,0.04)';
      const border = isMe ? '2px solid #4ade80' : '1px solid rgba(255,255,255,0.06)';
      const rankEl = medals[i] ? '<span style="font-size:20px;">' + medals[i] + '</span>' : '<span style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.4);">' + (i+1) + '</span>';
      html += '<div style="display:flex;align-items:center;background:' + bg + ';border-radius:10px;padding:10px 12px;margin-bottom:6px;border:' + border + ';">'
        + '<div style="width:36px;text-align:center;">' + rankEl + '</div>'
        + '<div style="flex:1;min-width:0;max-width:130px;font-size:14px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + s.player.name + (isMe ? '<span class="me-badge">Ty</span>' : '') + '</div>'
        + '<div style="width:54px;text-align:right;margin-right:8px;font-size:16px;font-weight:800;color:#4ade80;">' + s.total + ' pkt</div>'
        + '<div style="margin-left:auto;display:flex;">'
        + '<div style="width:26px;text-align:center;font-size:13px;font-weight:600;color:#4ade80;">' + s.exact + '</div>'
        + '<div style="width:26px;text-align:center;font-size:13px;font-weight:600;color:#fbbf24;">' + s.draw + '</div>'
        + '<div style="width:26px;text-align:center;font-size:13px;font-weight:600;color:#60a5fa;">' + s.winner + '</div>'
        + '<div style="width:26px;text-align:center;font-size:13px;font-weight:600;color:#fb923c;">' + s.drawCorrect + '</div>'
        + '<div style="width:26px;text-align:center;font-size:13px;font-weight:600;color:rgba(255,255,255,0.3);">' + s.miss + '</div>'
        + '</div></div>';
    });
  }

  html += '<div style="margin-top:1rem;padding:0.75rem 1rem;background:rgba(255,255,255,0.04);border-radius:10px;font-size:12px;color:rgba(255,255,255,0.5);line-height:1.9;border:1px solid rgba(255,255,255,0.07);">'
    + '<strong style="color:rgba(255,255,255,0.8);">System punktów:</strong><br>'
    + '✅ Dokładny wynik: <strong style="color:#fff;">+' + POINTS.exact + ' pkt</strong> &nbsp;|&nbsp; 🟡 Dokładny remis: <strong style="color:#fff;">+' + POINTS.draw_exact + ' pkt</strong><br>'
    + '🔵 Trafiony zwycięzca: <strong style="color:#fff;">+' + POINTS.winner + ' pkt</strong> &nbsp;|&nbsp; 🟠 Trafiony remis: <strong style="color:#fff;">+' + POINTS.draw_correct + ' pkt</strong><br>'
    + '🏆 Kto przejdzie dalej: <strong style="color:#fff;">+' + POINTS.qualifier + ' pkt</strong> &nbsp;|&nbsp; ⚪ Pudło: <strong style="color:#fff;">0 pkt</strong>'
    + '</div>';

  el.innerHTML = html;
}

function renderSpecials() {
  const el = document.getElementById('view-specials');
  let html = '<div class="section-title">Typy specjalne</div>'
    + '<div style="font-size:13px;color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.04);padding:10px 12px;border-radius:8px;margin-bottom:1rem;border:1px solid rgba(255,255,255,0.07);">Obstaw raz — nie możesz zmienić swojego typu. Punkty zostaną ogłoszone po turnieju.</div>';

  for (const cat of SPECIAL_CATEGORIES) {
    const myPick = allSpecials.find(function(s) { return s.player_id === currentPlayer.id && s.category === cat.id; });
    const allPicks = allSpecials.filter(function(s) { return s.category === cat.id; });
    html += '<div class="special-card"><div class="special-title">' + cat.label + '</div>';
    if (myPick) {
      html += '<div class="special-my">Twój typ: ' + myPick.value
        + (myPick.points ? ' <span class="pred-points pts-exact">+' + myPick.points + ' pkt</span>' : '') + '</div>';
    } else {
      html += '<div class="special-input-row">'
        + '<input type="text" id="sp_' + cat.id + '" placeholder="' + cat.placeholder + '" maxlength="40" />'
        + '<button class="btn btn-primary btn-small" style="padding:9px 16px;" onclick="saveSpecial(\'' + cat.id + '\')">Postaw</button>'
        + '</div>';
    }
    if (allPicks.length) {
      html += '<div class="all-preds-title" style="margin-top:8px;">Typy graczy (' + allPicks.length + ')</div>';
      for (const pick of allPicks) {
        const player = allPlayers.find(function(pl) { return pl.id === pick.player_id; });
        const isMe = pick.player_id === currentPlayer.id;
        html += '<div class="pred-row">'
          + '<span class="pred-name">' + (player ? player.name : '?') + (isMe ? '<span class="me-badge">Ty</span>' : '')
          + (isAdmin ? ' <button class="btn btn-secondary btn-small" onclick="deleteSpecialAdmin(\'' + pick.id + '\')">Usuń</button>' : '') + '</span>'
          + '<span style="font-weight:600;color:#fff;">' + pick.value
          + (pick.points ? ' <span class="pred-points pts-exact">+' + pick.points + ' pkt</span>' : '') + '</span></div>';
      }
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

async function saveSpecial(categoryId) {
  const input = document.getElementById('sp_' + categoryId);
  const value = input ? input.value.trim() : '';
  if (!value) return showToast('Wpisz odpowiedź!');
  if (allSpecials.find(function(s) { return s.player_id === currentPlayer.id && s.category === categoryId; })) return showToast('Już obstawiłeś!');
  const { error } = await db.from('special_predictions').insert({ player_id: currentPlayer.id, category: categoryId, value: value, points: null });
  if (error) return showToast('Błąd: ' + error.message);
  showToast('Typ zapisany! ✅');
  await loadData();
}

async function deleteSpecialAdmin(id) {
  if (!isAdmin) return;
  await db.from('special_predictions').delete().eq('id', id);
  showToast('Usunięto');
  await loadData();
}

function showAdminTab(t) { adminTab = t; renderAdmin(); }

function renderAdmin() {
  if (!isAdmin) return;
  const el = document.getElementById('view-admin');
  let html = '<div class="tab-btns">'
    + '<button class="tab-btn' + (adminTab==='players'?' active':'') + '" onclick="showAdminTab(\'players\')">Gracze</button>'
    + '<button class="tab-btn' + (adminTab==='matches'?' active':'') + '" onclick="showAdminTab(\'matches\')">Mecze</button>'
    + '<button class="tab-btn' + (adminTab==='results'?' active':'') + '" onclick="showAdminTab(\'results\')">Wyniki</button>'
    + '</div>';

  if (adminTab === 'players') {
    html += '<div class="add-form"><h3>➕ Dodaj gracza</h3>'
      + '<div class="inline-fields">'
      + '<div class="field"><label>Nick</label><input type="text" id="new-name" placeholder="Np. ArturW" maxlength="20" /></div>'
      + '<div class="field"><label>Hasło</label><input type="text" id="new-pass" placeholder="Hasło..." maxlength="30" /></div>'
      + '</div>'
      + '<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;cursor:pointer;color:rgba(255,255,255,0.6);"><input type="checkbox" id="new-is-admin" /> Admin</label>'
      + '<button class="btn btn-primary" style="margin-top:10px;" onclick="addPlayer()">Dodaj gracza</button></div>';
    if (allPlayers.length) {
      html += '<div class="card">';
      for (const p of allPlayers) {
        html += '<div class="user-row"><span class="user-name">' + p.name + (p.is_admin?' 🔑':'') + '</span>'
          + '<span class="user-pass">' + (p.password||'—') + '</span>'
          + '<button class="btn btn-danger btn-small" onclick="deletePlayer(\'' + p.id + '\',\'' + p.name + '\')">Usuń</button></div>';
      }
      html += '</div>';
    }
  }

  if (adminTab === 'matches') {
    html += '<div class="add-form"><h3>➕ Dodaj mecz</h3>'
      + '<div class="inline-fields">'
      + '<div class="field"><label>Gospodarz</label><input type="text" id="nm-home" placeholder="Np. Brazylia" /></div>'
      + '<div class="field"><label>Gość</label><input type="text" id="nm-away" placeholder="Np. Niemcy" /></div>'
      + '</div>'
      + '<div class="inline-fields" style="margin-top:8px;">'
      + '<div class="field"><label>Data i czas</label><input type="datetime-local" id="nm-date" /></div>'
      + '<div class="field"><label>Etap</label><select id="nm-stage">'
      + '<option value="Faza grupowa">Faza grupowa</option>'
      + '<option value="1/16 finału">1/16 finału</option>'
      + '<option value="1/8 finału">1/8 finału</option>'
      + '<option value="Ćwierćfinał">Ćwierćfinał</option>'
      + '<option value="Półfinał">Półfinał</option>'
      + '<option value="Mecz o 3. miejsce">Mecz o 3. miejsce</option>'
      + '<option value="Finał">Finał</option>'
      + '</select></div></div>'
      + '<div class="field" style="margin-top:8px;"><label>Grupa (opcjonalnie)</label><input type="text" id="nm-group" placeholder="Np. A" maxlength="5" /></div>'
      + '<button class="btn btn-primary" style="margin-top:10px;" onclick="addMatch()">Dodaj mecz</button></div>';

    const upcoming = allMatches.filter(function(m) { return m.home_score === null; });
    if (upcoming.length) {
      html += '<div class="card">';
      for (const m of upcoming) {
        html += '<div class="admin-match" style="display:flex;align-items:center;gap:8px;">'
          + '<div style="flex:1;"><div class="admin-match-name">' + m.home_team + ' vs ' + m.away_team + '</div>'
          + '<div style="font-size:11px;color:rgba(255,255,255,0.3);">' + formatDate(m.match_date) + (m.group_name?' · Gr.'+m.group_name:'') + ' · ' + m.stage + '</div></div>'
          + '<button class="btn btn-danger btn-small" data-match-id="' + m.id + '">Usuń</button></div>';
      }
      html += '</div>';
    } else { html += '<div class="empty">Brak nadchodzących meczów</div>'; }
  }

  if (adminTab === 'results') {
    const pending = allMatches.filter(function(m) { return m.home_score === null && matchStatus(m) === 'locked'; });
    if (!pending.length) {
      html += '<div class="empty">Brak meczów do wpisania.<br><small>Pojawią się 10 min przed startem.</small></div>';
    } else {
      html += '<div class="card">';
      for (const m of pending) {
        const ko = isKnockout(m);
        html += '<div class="admin-match"><div class="admin-match-name">' + m.home_team + ' vs ' + m.away_team + ' · ' + formatDate(m.match_date) + '</div>'
          + '<div class="admin-score-row" style="margin-bottom:' + (ko?'8px':'0') + ';">'
          + '<input type="number" id="ar_h_' + m.id + '" min="0" max="20" placeholder="0" />'
          + '<span style="font-size:18px;font-weight:700;color:#fff;">:</span>'
          + '<input type="number" id="ar_a_' + m.id + '" min="0" max="20" placeholder="0" />'
          + '</div>'
          + (ko ? '<div style="margin-bottom:8px;"><div style="font-size:11px;color:rgba(255,255,255,0.4);font-weight:600;margin-bottom:4px;">KTO PRZECHODZI:</div><div style="display:flex;gap:6px;">'
            + '<button type="button" id="ar_qual_' + m.id + '_home" onclick="selectAdminQualifier(\'' + m.id + '\',\'home\')" style="flex:1;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:#fff;">' + m.home_team + '</button>'
            + '<button type="button" id="ar_qual_' + m.id + '_away" onclick="selectAdminQualifier(\'' + m.id + '\',\'away\')" style="flex:1;padding:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:#fff;">' + m.away_team + '</button>'
            + '</div><input type="hidden" id="ar_qual_val_' + m.id + '" value="" /></div>' : '')
          + '<button class="btn btn-primary btn-small" onclick="saveResult(\'' + m.id + '\')">Zatwierdź ✓</button></div>';
      }
      html += '</div>';
    }
    const withResult = allMatches.filter(function(m) { return m.home_score !== null; });
    if (withResult.length) {
      html += '<div class="section-title" style="margin-top:1.5rem;">Zakończone</div><div class="card">';
      for (const m of withResult) {
        html += '<div class="admin-match" style="display:flex;align-items:center;justify-content:space-between;">'
          + '<div><div class="admin-match-name">' + m.home_team + ' ' + m.home_score + ':' + m.away_score + ' ' + m.away_team + '</div>'
          + (isKnockout(m) && m.qualifier ? '<div style="font-size:11px;color:#c084fc;">dalej: ' + m.qualifier + '</div>' : '') + '</div>'
          + '<button class="btn btn-secondary btn-small" onclick="clearResult(\'' + m.id + '\')">Cofnij</button></div>';
      }
      html += '</div>';
    }
  }

  el.innerHTML = html;
  el.querySelectorAll('[data-match-id]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const id = btn.getAttribute('data-match-id');
      const name = btn.closest('.admin-match').querySelector('.admin-match-name').textContent;
      deleteMatch(id, name);
    });
  });
}

async function addPlayer() {
  const name = document.getElementById('new-name').value.trim();
  const pass = document.getElementById('new-pass').value.trim();
  const isAdminPlayer = document.getElementById('new-is-admin').checked;
  if (!name || !pass) return showToast('Wpisz nick i hasło!');
  const { error } = await db.from('players').insert({ name: name, password: pass, is_admin: isAdminPlayer });
  if (error) return showToast(error.message.includes('unique') ? 'Ten nick już istnieje!' : 'Błąd: ' + error.message);
  document.getElementById('new-name').value = '';
  document.getElementById('new-pass').value = '';
  document.getElementById('new-is-admin').checked = false;
  showToast('Dodano: ' + name + ' ✅');
  await loadData();
}

async function deletePlayer(id, name) {
  if (!confirm('Usunąć gracza "' + name + '"?')) return;
  await db.from('predictions').delete().eq('player_id', id);
  await db.from('players').delete().eq('id', id);
  showToast('Usunięto: ' + name);
  await loadData();
}

async function addMatch() {
  const home = document.getElementById('nm-home').value.trim();
  const away = document.getElementById('nm-away').value.trim();
  const dateVal = document.getElementById('nm-date').value;
  const stage = document.getElementById('nm-stage').value;
  const group = document.getElementById('nm-group').value.trim().toUpperCase() || null;
  if (!home || !away || !dateVal) return showToast('Wypełnij wszystkie pola!');
  const { error } = await db.from('matches').insert({ home_team: home, away_team: away, match_date: new Date(dateVal).toISOString(), stage: stage, group_name: group });
  if (error) return showToast('Błąd: ' + error.message);
  document.getElementById('nm-home').value = '';
  document.getElementById('nm-away').value = '';
  document.getElementById('nm-date').value = '';
  document.getElementById('nm-group').value = '';
  showToast('Dodano: ' + home + ' vs ' + away + ' ✅');
  await loadData();
}

async function deleteMatch(id, name) {
  if (!confirm('Usunąć mecz "' + name + '"?')) return;
  await db.from('predictions').delete().eq('match_id', id);
  await db.from('matches').delete().eq('id', id);
  showToast('Mecz usunięty');
  await loadData();
}

function selectAdminQualifier(matchId, side) {
  const hBtn = document.getElementById('ar_qual_' + matchId + '_home');
  const aBtn = document.getElementById('ar_qual_' + matchId + '_away');
  const val = document.getElementById('ar_qual_val_' + matchId);
  if (!hBtn || !aBtn || !val) return;
  const match = allMatches.find(function(m) { return m.id === matchId; });
  if (side === 'home') {
    hBtn.style.background = '#4ade80'; hBtn.style.color = '#0f1923'; hBtn.style.borderColor = '#4ade80';
    aBtn.style.background = 'rgba(255,255,255,0.07)'; aBtn.style.color = '#fff'; aBtn.style.borderColor = 'rgba(255,255,255,0.15)';
    val.value = match.home_team;
  } else {
    aBtn.style.background = '#4ade80'; aBtn.style.color = '#0f1923'; aBtn.style.borderColor = '#4ade80';
    hBtn.style.background = 'rgba(255,255,255,0.07)'; hBtn.style.color = '#fff'; hBtn.style.borderColor = 'rgba(255,255,255,0.15)';
    val.value = match.away_team;
  }
}

async function saveResult(matchId) {
  const h = parseInt(document.getElementById('ar_h_' + matchId) ? document.getElementById('ar_h_' + matchId).value : '');
  const a = parseInt(document.getElementById('ar_a_' + matchId) ? document.getElementById('ar_a_' + matchId).value : '');
  if (isNaN(h) || isNaN(a)) return showToast('Wpisz wynik!');
  const match = allMatches.find(function(m) { return m.id === matchId; });
  const qualInput = document.getElementById('ar_qual_val_' + matchId);
  const qualifier = (isKnockout(match) && qualInput) ? (qualInput.value || null) : null;
  if (isKnockout(match) && !qualifier) return showToast('Wybierz kto przechodzi!');
  await db.from('matches').update({ home_score: h, away_score: a, qualifier: qualifier }).eq('id', matchId);
  showToast('Wynik zapisany ✅');
  await loadData();
}

async function clearResult(matchId) {
  await db.from('matches').update({ home_score: null, away_score: null, qualifier: null }).eq('id', matchId);
  showToast('Wynik cofnięty');
  await loadData();
}
</script>
